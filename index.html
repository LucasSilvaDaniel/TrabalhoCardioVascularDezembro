<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedimentos Cardiovasculares — Apresentação</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage" id="stage" aria-label="Apresentação de procedimentos cardiovasculares">
    <a class="video-hit" id="videoHit" target="_blank" rel="noopener noreferrer" aria-label="Abrir vídeo em nova aba">
      <span>▶ Assistir ao vídeo</span>
    </a>
  </main>

  <button class="nav" id="prev" type="button" aria-label="Slide anterior" title="Anterior (←)">‹</button>
  <button class="nav" id="next" type="button" aria-label="Próximo slide" title="Próximo (→)">›</button>

  <div class="hud">
    <span id="counter">01 / 28</span>
    <div class="track" aria-hidden="true"><div id="bar"></div></div>
    <button class="full" id="full" type="button" aria-label="Tela cheia" title="Tela cheia (F)">⛶</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
